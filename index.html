<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>My Portfolio - Windows XP</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Boot Screen -->
    <div id="boot-screen" class="boot-screen">
      <div class="boot-logo">
        <span class="boot-text">Microsoft</span>
        <h1 class="boot-title">Windows<span class="boot-xp">XP</span></h1>
      </div>
      <div class="boot-loader">
        <div class="boot-bar"></div>
      </div>
    </div>

    <!-- Desktop Environment -->
    <div id="desktop" class="desktop">
      <div class="desktop-icons-container" id="desktop-icons"></div>
      <div id="windows-container"></div>
    </div>

    <!-- Taskbar -->
    <div id="taskbar" class="taskbar">
      <button id="start-button" class="start-button">
        <!-- Exact windows XP start icon placeholder -->
        <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxNiAxNiI+PHBhdGggZD0iTTIgOGw1LTJWNEwyIDh6TTE0IDhsLTUtMlY0bDUgNHpNMjggMTBsNS0ydjRMMiAxeiIgZmlsbD0iI2ZmZiIvPjwvc3ZnPg==" alt="Start" class="start-icon" />
        <span class="start-text">start</span>
      </button>
      
      <div class="quick-launch">
        <div class="quick-launch-icon">
          <!-- Show Desktop icon placeholder -->
          <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxNiAxNiI+PHJlY3QgeD0iMSIgeT0iMiIgd2lkdGg9IjE0IiBoZWlnaHQ9IjExIiBmaWxsPSIjNjg5Q0QyIiBzdHJva2U9IiMzMzMiLz48cmVjdCB4PSIyIiB5PSIzIiB3aWR0aD0iMTIiIGhlaWdodD0iOSIgZmlsbD0iI2ZmZiIvPjwvc3ZnPg==" alt="Show Desktop" />
        </div>
      </div>

      <!-- Open window tabs -->
      <div id="taskbar-tabs" class="taskbar-tabs"></div>

      <!-- System Tray / Clock -->
      <div id="system-tray" class="system-tray">
        <div class="system-tray-icons">
          <!-- Generic system icons like volume, network -->
          <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxNiAxNiI+PHBhdGggZD0iTTIgNnY0aDRsNSA1VjFsLTUgNVoiIGZpbGw9IiNjY2MiIHN0cm9rZT0iIzMzMyIvPjwvc3ZnPg==" alt="Volume" class="tray-icon" />
        </div>
        <div id="clock" class="clock">12:00 PM</div>
      </div>
    </div>

    <!-- Start Menu (Exact Copy Layout) -->
    <div id="start-menu" class="start-menu hidden">
      <div class="start-menu-header">
        <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0OCA0OCI+PHJlY3Qgd2lkdGg9IjQ4IiBoZWlnaHQ9IjQ4IiBmaWxsPSIjZmZmIi8+PGNpcmNsZSBjeD0iMjQiIGN5PSIxOCIgcj0iOCIgZmlsbD0iI2Q0ZDQwMCIvPjxwYXRoIGQ9Ik0xMiAzOGE4IDggMCAwIDEgMTYtOGgxMGE4IDggMCAwIDEgOCB4eiIgZmlsbD0iIzMzMyIvPjwvc3ZnPg==" alt="User" class="user-avatar" />
        <span class="user-name">Guest</span>
      </div>

      <div class="start-menu-body">
        <div class="start-menu-left">
          <ul id="start-menu-items" class="start-menu-list">
            <!-- Items injected via JS -->
          </ul>
          <div class="start-menu-separator"></div>
          <div class="all-programs">
            <span>All Programs</span>
            <div class="all-programs-arrow">▶</div>
          </div>
        </div>
        <div class="start-menu-right">
          <ul class="start-menu-list right-list">
            <li class="right-item">
              <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+PHBhdGggZD0iTTAgNGw2LTZIMjR2MTZIMHoiIGZpbGw9IiNmZmQxNjYiLz48cGF0aCBkPSJNMCA4aDI0VjI0SDB6IiBmaWxsPSIjZmZhYzAwIi8+PC9zdmc+" alt="My Documents">
              <span>My Documents</span>
            </li>
            <li class="right-item">
              <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+PHBhdGggZD0iTTAgNGw2LTZIMjR2MTZIMHoiIGZpbGw9IiNmZmQxNjYiLz48cGF0aCBkPSJNMCA4aDI0VjI0SDB6IiBmaWxsPSIjZmZhYzAwIi8+PC9zdmc+" alt="My Recent Documents">
              <span>My Recent Documents</span>
            </li>
            <div class="start-menu-separator right-separator"></div>
            <li class="right-item">
              <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+PHJlY3QgeD0iMiIgeT0iNCIgd2lkdGg9IjIwIiBoZWlnaHQ9IjE2IiByeD0iMiIgZmlsbD0iI2Q0ZDQwMCIvPjxyZWN0IHg9IjQiIHk9IjYiIHdpZHRoPSIxNiIgaGVpZ2h0PSIxMiIgZmlsbD0iIzAwNThlNiIvPjwvc3ZnPg==" alt="My Computer">
              <span>My Computer</span>
            </li>
            <li class="right-item">
              <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+PHBhdGggZD0iTTIgNnYxMmgyMGwtMTAtNnoiIGZpbGw9IiM2NjYiLz48L3N2Zz4=" alt="My Network Places">
              <span>My Network Places</span>
            </li>
            <div class="start-menu-separator right-separator"></div>
            <li class="right-item">
              <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+PGNpcmNsZSBjeD0iMTIiIGN5PSIxMiIgcj0iOCIgZmlsbD0iIzY2NiIvPjwvc3ZnPg==" alt="Control Panel">
              <span>Control Panel</span>
            </li>
            <li class="right-item">
              <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+PHBhdGggZD0iTTIgMmgxMnYxMkgyeiIgZmlsbD0iIzMzMyIvPjwvc3ZnPg==" alt="Run">
              <span>Run...</span>
            </li>
          </ul>
        </div>
      </div>

      <div class="start-menu-footer">
        <button class="footer-btn log-off-btn">
          <div class="icon-bg orange-icon">
            <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxNiAxNiI+PHBhdGggZD0iTTggNGM0IDAgNCAyIDQgNHY0SDhWNHpNMyA4aDVtLTUgM2g1IiBzdHJva2U9IiNmZmYiIHN0cm9rZS13aWR0aD0iMiIvPjwvc3ZnPg==" alt="Log Off" />
          </div>
          Log Off
        </button>
        <button class="footer-btn shut-down-btn" id="shutdown-btn">
          <div class="icon-bg red-icon">
            <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxNiAxNiI+PHBhdGggZD0iTTggMnY2bTAtNiA2IDZtLTItNi00IDQiIHN0cm9rZT0iI2ZmZiIgc3Ryb2tlLXdpZHRoPSIyIi8+PC9zdmc+" alt="Shut Down" />
          </div>
          Shut Down
        </button>
      </div>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
